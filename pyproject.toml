[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xefm"
description = "XeFM — a dual-pane file manager for the desktop and the terminal"
readme = "README.md"
license = "MIT"
authors = [{ name = "Tomonori Shimomura" }]
requires-python = ">=3.10"
keywords = ["file manager", "dual-pane", "gui", "desktop", "terminal", "tui", "curses"]
# version  -> single-sourced from xefm/__init__.py's __version__ (see [tool.setuptools.dynamic]).
# dependencies -> single-sourced from requirements.txt (shared with `make venv`).
dynamic = ["version", "dependencies"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.scripts]
xefm = "xefm.app:main"

[project.urls]
Homepage = "https://github.com/shimomut/xefm"
Repository = "https://github.com/shimomut/xefm"
Issues = "https://github.com/shimomut/xefm/issues"

# Flat layout, matching PuiKit's own repo: the whole application is the ``xefm``
# package at the repo root — ``xefm.app`` is the entry module (FileManager +
# top-level UI) and its siblings are the business-logic modules. ``python -m
# xefm`` and the ``xefm`` console script both land in ``xefm.app:main``, and
# because ``-m`` puts the working directory on sys.path, running from a checkout
# needs no install and no PYTHONPATH.
#
# PuiKit, XeFM's UI framework, is declared in requirements.txt (``puikit>=1.0``),
# so it flows into the dynamic dependencies below and resolves from PyPI on a
# normal install. For co-development, ``make venv`` additionally installs it
# editable from ../puikit, which overrides the PyPI build.
[tool.setuptools.packages.find]
include = ["xefm*"]

[tool.setuptools.package-data]
# End-user external programs invoked by XeFM (xefm/tools/*). The ``_config.py``
# template ships automatically as a package .py module.
xefm = ["tools/*"]

[tool.setuptools.dynamic]
version = { attr = "xefm.__version__" }
dependencies = { file = ["requirements.txt"] }
