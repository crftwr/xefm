[pytest]
# Run tests with timeout and process isolation
timeout = 10
timeout_method = thread

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options and xdist settings
# -n 1 = one worker process (isolated but sequential, works with PyObjC)
# -n auto = parallel across all CPU cores (faster but may have issues)
# quality_loop.pytest_plugin: the desktop and host_only marks (#842) - a
# desktop test runs only with --desktop, which a VM run passes; a host_only
# one is skipped in every guest, and --host-only runs those alone.
addopts = 
    -n 1
    -v
    --tb=short
    --strict-markers
    -p quality_loop.pytest_plugin

# Markers for categorizing tests
markers =
    gui: Tests that create GUI windows (may need display)
    slow: Tests that take a long time to run
    integration: Integration tests
    unit: Unit tests
    requires_s3: Tests that require S3 access
    requires_cpp: Tests that require C++ extensions

# Ignore patterns. cleanroom/ holds quality-loop's rooms, each with the
# extension package (and tests) its session wrote - not this repo's tests.
norecursedirs = .git .venv __pycache__ dist build *.egg-info .pytest_cache cleanroom

# Warning filters
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
